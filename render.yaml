# Render Blueprint — one Docker web service plus Postgres.
#
#   requisor-api   web service (Docker)   Express API under /api AND the static site + game
#                                         previews, all served from one container
#   requisor-db    Postgres               DATABASE_URL for the API
#
# History: the first version used Render's native Node runtime with a separate static site and an
# /api/* rewrite. Render's Node build image (Sept 2026) reinstalls pnpm into the read-only /usr
# before the build command runs and fails with EROFS regardless of repo configuration, so the
# build moved into ./Dockerfile and the API now serves the built site itself
# (artifacts/api-server/src/lib/site-static.ts). One origin, no rewrite, no hostname to check.
#
# The old `requisor-site` static site is no longer defined here. Render does not delete resources
# that disappear from a Blueprint; remove it from the dashboard by hand once requisor-api is up.
#
# Reference: https://render.com/docs/blueprint-spec

databases:
  - name: requisor-db
    region: oregon
    # Paid smallest tier (~$6/mo). `free` also works but expires 30 days after creation, has no
    # backups, and Render deletes it (drafts, orders, Boat Booth media) 14 days after that.
    plan: 0.1c-256mb
    databaseName: requisor
    user: requisor

services:
  - type: web
    # Keeps the identity of the service the first Blueprint created; only its runtime changes.
    name: requisor-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon            # must match the database's region for the internal DATABASE_URL
    # `free` (0.1 CPU) works for demos but spins down after 15 idle minutes: the first request then
    # waits ~1 minute, and Boat Booth's background video polling dies mid-job until the next request
    # wakes the service. 0.5c-512mb (~$7/mo) is the smallest always-on plan.
    plan: 0.5c-512mb
    healthCheckPath: /api/healthz
    # Schema + seed are a one-time manual step from your machine against the database's external
    # URL (DEPLOYMENT.md → Render → Database): the runtime image carries the built bundles and the
    # one package they link at startup, not pnpm or drizzle-kit, so there is no initialDeployHook.
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: requisor-db
          property: connectionString
      # Only needed for Boat Booth's AI scene generation; the rest of the API runs without it.
      # Render prompts for the value when the Blueprint is first applied and keeps it on updates.
      - key: XAI_API_KEY
        sync: false
    # PORT is injected by Render (10000); the server reads it and refuses to start without it.
